name: Build resume PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the resume
        uses: xu-cheng/latex-action@v4
        timeout-minutes: 15
        with:
          root_file: main.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error -outdir=build

      - name: Check that the resume has one page
        run: |
          if ! grep -Eq 'Output written on .*\(1 page,' build/main.log; then
            echo "The resume must be exactly one page. Check build/main.log for the page count." >&2
            exit 1
          fi
          cp build/main.pdf Resume.pdf

      - name: Publish the PDF to a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="resume-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" Resume.pdf \
            --target "$GITHUB_SHA" \
            --title "Resume (run ${GITHUB_RUN_NUMBER})" \
            --notes "Built from commit ${GITHUB_SHA}." \
            --latest
